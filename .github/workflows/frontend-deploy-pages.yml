name: Deploy frontend to GitHub Pages

# Manual on purpose: a deploy is only useful once the API is reachable, and the site
# needs the repository variable VITE_API_URL (Settings > Secrets and variables > Actions
# > Variables) pointing at it. Also set Settings > Pages > Source to "GitHub Actions".
# Then run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          # A project site lives under /<repository>/, not at the root.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Pages answers unknown paths with 404.html. Serving the app shell there lets
      # the router handle a deep link or a refresh on /employees.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
